<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Fedews' Tweaks and Fixes</title>
  <desc id="d">A night city skyline with glowing traffic light trails on a highway, with the mod title.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#2a1650"/>
      <stop offset="0.82" stop-color="#7a2a6b"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#ffb46b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14112a"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="trailRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ff3b5c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd0d8"/>
    </linearGradient>
    <linearGradient id="trailWhite" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="busLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="windows" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="4" height="6" fill="#ffd27a" opacity="0.85"/>
      <rect x="9" y="4" width="3" height="6" fill="#ffd27a" opacity="0.25"/>
      <rect x="3" y="12" width="4" height="4" fill="#ffd27a" opacity="0.15"/>
      <rect x="9" y="12" width="3" height="4" fill="#9fd8ff" opacity="0.6"/>
    </pattern>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feFlood flood-color="#ff7ab6" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b0820" stop-opacity="0.78"/>
      <stop offset="0.6" stop-color="#0b0820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b0820" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky -->
    <rect width="1280" height="420" fill="url(#sky)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- Stars -->
    <g fill="#ffffff">
      <circle cx="80" cy="40" r="1.2" opacity="0.8"/><circle cx="210" cy="72" r="1" opacity="0.6"/>
      <circle cx="330" cy="28" r="1.4" opacity="0.9"/><circle cx="470" cy="60" r="1" opacity="0.5"/>
      <circle cx="610" cy="22" r="1.1" opacity="0.7"/><circle cx="760" cy="52" r="1.3" opacity="0.8"/>
      <circle cx="880" cy="30" r="1" opacity="0.6"/><circle cx="1010" cy="70" r="1.2" opacity="0.7"/>
      <circle cx="1150" cy="36" r="1.4" opacity="0.9"/><circle cx="1230" cy="88" r="1" opacity="0.5"/>
      <circle cx="140" cy="110" r="0.9" opacity="0.4"/><circle cx="560" cy="96" r="0.9" opacity="0.4"/>
    </g>

    <!-- Far skyline -->
    <g fill="#24183f">
      <rect x="0" y="250" width="60" height="120"/><rect x="58" y="226" width="44" height="144"/>
      <rect x="100" y="262" width="70" height="108"/><rect x="168" y="214" width="38" height="156"/>
      <rect x="560" y="236" width="52" height="134"/><rect x="610" y="258" width="64" height="112"/>
      <rect x="930" y="232" width="48" height="138"/><rect x="976" y="256" width="70" height="114"/>
      <rect x="1180" y="240" width="60" height="130"/><rect x="1236" y="262" width="44" height="108"/>
    </g>

    <!-- Near skyline -->
    <g fill="#120d26">
      <rect x="20" y="280" width="64" height="90"/>
      <rect x="196" y="190" width="58" height="180"/><rect x="214" y="168" width="22" height="24"/>
      <rect x="252" y="236" width="80" height="134"/>
      <rect x="330" y="206" width="48" height="164"/>
      <rect x="440" y="248" width="70" height="122"/>
      <rect x="676" y="214" width="56" height="156"/>
      <rect x="730" y="170" width="62" height="200"/><polygon points="730,170 761,138 792,170"/>
      <rect x="790" y="246" width="74" height="124"/>
      <rect x="862" y="222" width="46" height="148"/>
      <rect x="1044" y="200" width="60" height="170"/><rect x="1066" y="182" width="4" height="20"/>
      <rect x="1102" y="250" width="80" height="120"/>
    </g>
    <g fill="url(#windows)" opacity="0.9">
      <rect x="200" y="200" width="50" height="168"/>
      <rect x="256" y="244" width="72" height="124"/>
      <rect x="334" y="214" width="40" height="154"/>
      <rect x="444" y="256" width="62" height="112"/>
      <rect x="680" y="222" width="48" height="146"/>
      <rect x="734" y="178" width="54" height="190"/>
      <rect x="794" y="254" width="66" height="114"/>
      <rect x="866" y="230" width="38" height="138"/>
      <rect x="1048" y="208" width="52" height="160"/>
      <rect x="1106" y="258" width="72" height="110"/>
      <rect x="24" y="288" width="56" height="80"/>
    </g>

    <!-- Highway -->
    <rect x="0" y="368" width="1280" height="52" fill="url(#road)"/>
    <rect x="0" y="368" width="1280" height="2" fill="#ff8a4c" opacity="0.5"/>
    <!-- Bus lane (kept clear) -->
    <rect x="0" y="404" width="1280" height="14" fill="url(#busLane)" opacity="0.6"/>
    <text x="640" y="415" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="6" fill="#ffd9cf" opacity="0.8">BUS ONLY · BUS ONLY · BUS ONLY</text>
    <!-- Light trails -->
    <g filter="url(#soft)">
      <rect x="40" y="376" width="420" height="4" rx="2" fill="url(#trailRed)"/>
      <rect x="520" y="379" width="360" height="3" rx="1.5" fill="url(#trailRed)"/>
      <rect x="930" y="377" width="300" height="4" rx="2" fill="url(#trailRed)"/>
      <rect x="120" y="391" width="380" height="4" rx="2" fill="url(#trailWhite)"/>
      <rect x="600" y="393" width="420" height="3" rx="1.5" fill="url(#trailWhite)"/>
      <rect x="1060" y="390" width="220" height="4" rx="2" fill="url(#trailWhite)"/>
    </g>
    <g>
      <rect x="40" y="377" width="420" height="2" rx="1" fill="url(#trailRed)"/>
      <rect x="520" y="380" width="360" height="1.5" rx="1" fill="url(#trailRed)"/>
      <rect x="930" y="378" width="300" height="2" rx="1" fill="url(#trailRed)"/>
      <rect x="120" y="392" width="380" height="2" rx="1" fill="url(#trailWhite)"/>
      <rect x="600" y="394" width="420" height="1.5" rx="1" fill="url(#trailWhite)"/>
      <rect x="1060" y="391" width="220" height="2" rx="1" fill="url(#trailWhite)"/>
    </g>

    <!-- Haze behind the title so it stays readable -->
    <ellipse cx="640" cy="186" rx="470" ry="112" fill="url(#haze)"/>

    <!-- Title -->
    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="640" y="132" font-size="22" font-weight="600" letter-spacing="8" fill="#ffc6a8" opacity="0.95">CITIES: SKYLINES II MOD</text>
      <text x="640" y="196" font-size="64" font-weight="800" fill="#ffffff" filter="url(#textGlow)">Fedews' Tweaks and Fixes</text>
      <text x="640" y="236" font-size="22" font-weight="500" fill="#e9defc" opacity="0.92">Sound control · Smarter parking · Clear bus lanes · Jam rescue</text>
    </g>
  </g>
</svg>
